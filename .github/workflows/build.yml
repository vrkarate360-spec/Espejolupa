name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el zip
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o -q "$z" -d _src; done
          if [ -d _src ]; then
            d=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
            cp -r "$d"/. .
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EspejoLupa.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EspejoLupa ${{ github.run_number }}
          files: EspejoLupa.apk
